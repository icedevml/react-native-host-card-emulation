name: Node.js Package

on:
  push:
    branches:
      - '*'
  release:
    types: [created]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      # Node.js 25+ doesn't bundle corepack, install it after setting up Node.js
      - run: npm install -g corepack@0.36.0
      - run: corepack enable
      - run: yarn install --immutable
      - run: |
          cd packages/host-card-emulation
          yarn test
      - run: |
          cd packages/host-card-emulation
          yarn pack

  publish-npm:
    if: github.event.release
    needs: build
    runs-on: ubuntu-26.04
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - run: npm install -g corepack@0.36.0
      - run: corepack enable
      - run: yarn install --immutable
      # Published with npm, as `yarn npm publish --provenance` calls Sigstore with its default 5 s
      # timeout: a slow Rekor response is retried and the retry fails with 409 (the entry already
      # exists). npm passes its fetch-timeout (5 min) to Sigstore.
      - run: |
          cd packages/host-card-emulation
          yarn pack --out package.tgz
          npm publish package.tgz --provenance --access public
