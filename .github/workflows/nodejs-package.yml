name: Node.js Package

on:
  push:
    branches:
      - '**'
  # the pull requests from forks don't trigger the push event of this repository
  pull_request:
  release:
    types: [created]

permissions:
  contents: read

jobs:
  build:
    # the pull requests from this repository's branches are already built on push
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      # Node.js 25+ doesn't bundle corepack, install it after setting up Node.js
      - run: npm install -g corepack@0.36.0
      - run: corepack enable
      - run: yarn install --immutable
      - run: |
          cd packages/host-card-emulation
          yarn typecheck
      - run: |
          cd packages/host-card-emulation
          yarn test
      - run: |
          cd packages/demo-ndef-app
          yarn test
      # the same command as in publish-npm, lists the files that would be published
      - run: |
          cd packages/host-card-emulation
          npm pack --dry-run --ignore-scripts

  android:
    # the pull requests from this repository's branches are already built on push
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      # Node.js 25+ doesn't bundle corepack, install it after setting up Node.js
      - run: npm install -g corepack@0.36.0
      - run: corepack enable
      # the React Native Gradle plugin runs the autolinking and the codegen from node_modules
      - run: yarn install --immutable
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
      # also validates the checksum of the committed Gradle wrapper jar
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      # the JVM tests of the native Android code, the library module is built within the demo app's project
      - run: |
          cd packages/demo-ndef-app/android
          ./gradlew :icedevml_react-native-host-card-emulation:testDebugUnitTest

  publish-npm:
    if: github.event.release
    needs: [build, android]
    runs-on: ubuntu-26.04
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      # This job can publish (it gets the OIDC token of npm trusted publishing), so no code of the dependencies
      # may run in it: nothing is installed. The package has no build step, `npm pack` only collects the files.
      # Published with npm, as `yarn npm publish --provenance` calls Sigstore with its default 5 s
      # timeout: a slow Rekor response is retried and the retry fails with 409 (the entry already
      # exists). npm passes its fetch-timeout (5 min) to Sigstore.
      - run: |
          cd packages/host-card-emulation
          TARBALL=$(npm pack --ignore-scripts)
          npm publish "$TARBALL" --provenance --access public --ignore-scripts
