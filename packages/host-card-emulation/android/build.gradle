def safeExtGet(prop, fallback) {
    rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}

// The Android Gradle Plugin and React Native versions are provided by the app's build.
apply plugin: 'com.android.library'
apply plugin: 'com.facebook.react'

android {
    compileSdkVersion safeExtGet('compileSdkVersion', 36)
    namespace "com.itsecrnd.rtnhceandroid"

    defaultConfig {
        // API 24 is the floor imposed by React Native's New Architecture,
        // the HCE APIs used here are available since API 22.
        minSdkVersion safeExtGet('minSdkVersion', 24)
    }
}

repositories {
    mavenCentral()
    google()
}

dependencies {
    implementation 'com.facebook.react:react-android'
}
