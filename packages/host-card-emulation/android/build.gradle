def safeExtGet(prop, fallback) {
    rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}

// The Android Gradle Plugin and React Native versions are provided by the app's build.
apply plugin: 'com.android.library'
apply plugin: 'com.facebook.react'

android {
    compileSdkVersion safeExtGet('compileSdkVersion', 36)
    namespace "com.itsecrnd.rtnhceandroid"

    defaultConfig {
        // API 24 is the floor imposed by React Native's New Architecture,
        // the HCE APIs used here are available since API 22.
        minSdkVersion safeExtGet('minSdkVersion', 24)
    }

    testOptions {
        unitTests {
            // required by Robolectric
            includeAndroidResources = true
            all {
                // Mockito attaches its agent at runtime, Robolectric's Android 16 uses the JDK internals
                jvmArgs '-XX:+EnableDynamicAgentLoading', '--add-opens=java.base/jdk.internal.access=ALL-UNNAMED'
            }
        }
    }
}

repositories {
    mavenCentral()
    google()
}

dependencies {
    implementation 'com.facebook.react:react-android'

    // the JVM tests run inside the demo app's build, see AGENTS.md
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.17'
    testImplementation 'org.mockito:mockito-core:5.24.0'
}
